<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ChainPay - Send</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#080B14;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.card{background:rgba(45,111,240,.08);border:1px solid rgba(45,111,240,.2);border-radius:14px;padding:20px;width:100%;max-width:380px;margin-bottom:16px}
.label{color:rgba(255,255,255,.35);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.value{color:#fff;font-size:14px;font-weight:600;word-break:break-all}
.amount{font-size:36px;font-weight:800;color:#2D6FF0}
.usd{color:rgba(255,255,255,.4);font-size:13px;margin-top:4px}
.btn{width:100%;max-width:380px;padding:18px;border-radius:16px;border:none;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px}
.primary{background:#2D6FF0;color:#fff}
.secondary{background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.08)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.status{margin-top:12px;padding:13px 16px;border-radius:12px;font-size:13px;text-align:center;width:100%;max-width:380px;display:none}
.info{background:rgba(45,111,240,.1);color:#63B3FF;display:block}
.success{background:rgba(16,185,129,.1);color:#10B981;display:block}
.error{background:rgba(239,68,68,.1);color:#EF4444;display:block}
.row{display:flex;justify-content:space-between;margin-bottom:6px}
.row-label{color:rgba(255,255,255,.4);font-size:13px}
.row-value{color:#fff;font-size:13px;font-weight:600}
.divider{height:1px;background:rgba(255,255,255,.06);margin:10px 0}
</style>
</head>
<body>
<h1 style="font-size:22px;font-weight:800;margin-bottom:6px">Confirm Transaction</h1>
<p style="color:rgba(255,255,255,.45);font-size:13px;text-align:center;margin-bottom:24px">Review and sign with MetaMask</p>

<div class="card">
  <div class="label">Amount</div>
  <div class="amount" id="amountEth">...</div>
  <div class="usd" id="amountUsd"></div>
</div>

<div class="card">
  <div class="label">To Address</div>
  <div class="value" id="toAddress">...</div>
</div>

<div class="card">
  <div class="row"><span class="row-label">Network</span><span class="row-value">Sepolia Testnet</span></div>
  <div class="divider"></div>
  <div class="row"><span class="row-label">Est. Gas</span><span class="row-value">~0.0001 ETH</span></div>
  <div class="divider"></div>
  <div class="row"><span class="row-label">You Pay</span><span class="row-value" id="total">...</span></div>
</div>

<button class="btn primary" id="btn" onclick="doSend()" disabled>Sign & Send with MetaMask</button>
<button class="btn secondary" onclick="doCancel()">Cancel</button>
<div class="status" id="status"></div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script>
var params   = new URLSearchParams(location.search);
var to       = params.get("to")       || "";
var amount   = params.get("amount")   || "";
var token    = params.get("token")    || "";
var redirect = params.get("redirect") || "";

if (to && amount) {
  document.getElementById("toAddress").textContent = to;
  document.getElementById("amountEth").textContent = amount + " ETH";
  document.getElementById("amountUsd").textContent = "≈ $" + (parseFloat(amount) * 3000).toFixed(2) + " USD";
  document.getElementById("total").textContent = (parseFloat(amount) + 0.0001).toFixed(6) + " ETH";
  document.getElementById("btn").disabled = false;
} else {
  showStatus("Missing transaction details. Go back to app.", "error");
}

function showStatus(m,t){
  var e=document.getElementById("status");
  e.textContent=m;
  e.className="status "+t;
}

function doCancel(){
  if (redirect) location.href = redirect + "?cancelled=1";
  else window.close();
}

async function doSend(){
  var btn = document.getElementById("btn");
  btn.disabled = true;
  btn.textContent = "Connecting MetaMask...";
  try {
    if (!window.ethereum) throw new Error("MetaMask not found. Please open in MetaMask browser.");
    var accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
    var from = accounts[0];
    var provider = new ethers.providers.Web3Provider(window.ethereum);
    var signer = provider.getSigner();

    // Check balance
    var balance = await provider.getBalance(from);
    var valueWei = ethers.utils.parseEther(amount);
    if (balance.lt(valueWei)) throw new Error("Insufficient balance in your wallet");

    showStatus("Confirm the transaction in MetaMask...", "info");
    btn.textContent = "Waiting for confirmation...";

    // Send from user wallet
    var tx = await signer.sendTransaction({ to: to, value: valueWei });

    showStatus("Transaction submitted! Recording...", "success");

    // Record on backend
    try {
      await fetch(location.origin + "/api/v1/transactions/record", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
          txHash:    tx.hash,
          from:      from,
          to:        to,
          amountEth: amount,
          amountWei: valueWei.toString(),
        })
      });
    } catch(_) {}

    showStatus("Sent! Returning to app...", "success");
    btn.textContent = "Done!";

    setTimeout(function(){
      if (redirect) location.href = redirect + "?txHash=" + encodeURIComponent(tx.hash) + "&success=1";
    }, 1500);

  } catch(err) {
    var m = err.message || "Failed";
    var cancelled = ["denied","rejected","cancel","user rejected"].some(function(w){
      return m.toLowerCase().indexOf(w) !== -1;
    });
    showStatus(cancelled ? "Cancelled." : "Error: " + m, "error");
    btn.disabled = false;
    btn.textContent = "Try Again";
  }
}
</script>
</body>
</html>
